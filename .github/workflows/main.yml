name: Heti magyar megjelenések

on:
  schedule:
    # 1:15 Budapest idő szerint, péntekre - a két időszámítás miatt eltérő UTC nap/óra kell:
    - cron: "15 23 * * 4"   # nyári időszámítás (CEST, UTC+2): csütörtök 23:15 UTC = péntek 1:15
    - cron: "15 0 * * 5"    # téli időszámítás (CET, UTC+1): péntek 0:15 UTC = péntek 1:15
  workflow_dispatch:        # kézi teszteléshez

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python send_weekly.py
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
